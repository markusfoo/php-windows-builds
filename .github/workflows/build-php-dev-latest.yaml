name: Build PHP TS Windows VS18 (x86 + x64 + AVX2, any php/php-src ref)

# ============================================================================
# UNIVERSAL PHP BUILDER
#
# Builds a Thread Safe (ZTS) Windows PHP distribution from ANY php/php-src
# ref -- no version is hardcoded:
#
#   php_ref       = master      -> next dev version (currently 8.7.0-dev;
#                                 was 8.6.0-dev until the PHP-8.6 branch
#                                 was cut)
#                 = PHP-8.6     -> the 8.6 release branch (8.6.0-dev +
#                                 release candidates once branched)
#                 = php-8.6.0RC1 (any tag) -> that exact release
#
#   php_version   = auto (default) -> the version string for artifact and
#                 release naming is DETECTED from the checked-out source
#                 (main/php_version.h), so a build can never be mislabeled
#                 again. Any other value is used verbatim as the label.
#
# History: this workflow was introduced as build-php86-dev-latest.yaml when
# master was 8.6.0-dev; it was renamed and universalized on 2026-09-26 when
# master bumped to 8.7.0-dev (see README changelog).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      php_ref:
        description: 'php/php-src ref to build: branch (master, PHP-8.6), tag (php-8.6.0RC1) or SHA'
        required: false
        default: 'master'
      php_version:
        description: 'Version label for artifacts/releases; "auto" = detect from the checked-out source (main/php_version.h)'
        required: false
        default: 'auto'
      include_avx2:
        description: 'Also build AVX2-optimized binaries (Intel Haswell 2013+, AMD Ryzen 2017+)'
        required: false
        default: true
        type: boolean
      include_x86:
        description: 'Build x86 (32-bit) variants in addition to x64'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, avx: no,  starter: phpsdk-vs18-x64.bat, avx_suffix: '',        avx_opt: '' }
          - { arch: x86, avx: no,  starter: phpsdk-vs18-x86.bat, avx_suffix: '',        avx_opt: '' }
          - { arch: x64, avx: yes, starter: phpsdk-vs18-x64.bat, avx_suffix: '-AVX2',   avx_opt: '--enable-native-intrinsics=avx2' }
          - { arch: x86, avx: yes, starter: phpsdk-vs18-x86.bat, avx_suffix: '-AVX2',   avx_opt: '--enable-native-intrinsics=avx2' }
    name: Build ${{ matrix.arch }}${{ matrix.avx == 'yes' && '-AVX2' || '' }}
    steps:
      - name: Skip AVX2 if disabled
        if: ${{ matrix.avx == 'yes' && !inputs.include_avx2 }}
        run: echo "AVX2 build skipped (include_avx2=false)" && exit 0

      - name: Skip x86 if disabled
        if: ${{ matrix.arch == 'x86' && !inputs.include_x86 }}
        run: echo "x86 build skipped (include_x86=false)" && exit 0

      - name: Checkout PHP source (${{ inputs.php_ref }})
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ inputs.php_ref }}
          path: php-src
          fetch-depth: 1

      - name: Checkout PHP SDK binary tools
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/checkout@v7
        with:
          repository: php/php-sdk-binary-tools
          ref: master
          path: php-sdk
          fetch-depth: 1

      - name: Resolve PHP version (auto-detect from source)
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ inputs.php_version }}'
          if ($version -eq 'auto') {
              $m = Select-String -Path "php-src\main\php_version.h" -Pattern '^#define\s+PHP_VERSION\s+"([^"]+)"'
              if (-not $m) { throw "Could not parse PHP_VERSION from php-src\main\php_version.h" }
              $version = $m.Matches[0].Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Invalid PHP version label: $version" }
          Write-Host "PHP version for this build: $version (source ref: ${{ inputs.php_ref }})"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PHP_VERSION=$version`n")

      - name: Generate build_php.bat via PowerShell (avoid cmd echo ^ escaping issues)
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: pwsh
        run: |
          $batContent = @'
          @echo off
          setlocal enableextensions enabledelayedexpansion

          cd ${{ github.workspace }}\php-src

          call buildconf.bat
          if errorlevel 1 exit /b 1

          call ${{ github.workspace }}\php-sdk\bin\phpsdk_deps.bat --update --force --batch
          if errorlevel 1 exit /b 1

          call configure.bat --enable-zts --enable-cli --enable-cgi --enable-apache2handler --enable-mbstring --with-openssl --with-curl --with-mysqli --with-pdo-mysql --enable-opcache --enable-intl --with-libxml --with-zlib --enable-fileinfo --enable-bcmath --enable-exif --enable-ftp --enable-gd --with-gettext --enable-mbregex --enable-pdo --with-pdo-sqlite --enable-shmop --enable-soap --enable-sockets --enable-sysvmsg --enable-sysvsem --enable-sysvshm --enable-xsl ${{ matrix.avx_opt }}
          if errorlevel 1 exit /b 1

          nmake
          exit /b %ERRORLEVEL%
          '@

          Set-Content -Path "${{ github.workspace }}\build_php.bat" -Value $batContent -Encoding ASCII
          Write-Host "Generated build_php.bat:"
          Get-Content "${{ github.workspace }}\build_php.bat"

      - name: Build PHP TS via starter script (TASK mode)
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: cmd
        run: |
          call ${{ github.workspace }}\php-sdk\${{ matrix.starter }} -t ${{ github.workspace }}\build_php.bat
          if errorlevel 1 (
            echo BUILD FAILED with exit code %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )
          echo BUILD SUCCEEDED

      - name: Locate built files (debug)
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: cmd
        run: |
          echo === Looking for php.exe in php-src tree ===
          dir /s /b ${{ github.workspace }}\php-src\php.exe 2>nul
          echo.
          echo === Looking for php8ts.dll ===
          dir /s /b ${{ github.workspace }}\php-src\php8ts.dll 2>nul
          echo.
          echo === Listing x64\Release_TS ===
          dir ${{ github.workspace }}\php-src\x64\Release_TS 2>nul
          echo.
          echo === Listing Release_TS ===
          dir ${{ github.workspace }}\php-src\Release_TS 2>nul
          exit /b 0

      - name: Package full distribution
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: cmd
        run: |
          set DIST_NAME=php-${{ env.PHP_VERSION }}-ts-Win32-vs18-${{ matrix.arch }}${{ matrix.avx_suffix }}
          set DIST_DIR=${{ github.workspace }}\%DIST_NAME%

          set REL_DIR=${{ github.workspace }}\php-src\x64\Release_TS
          if "${{ matrix.arch }}"=="x86" set REL_DIR=${{ github.workspace }}\php-src\Release_TS

          echo Using REL_DIR=%REL_DIR%
          dir "%REL_DIR%"
          echo.
          echo === Looking for deps\bin directory ===
          dir "${{ github.workspace }}\php-src\deps\bin" 2>nul
          dir "${{ github.workspace }}\deps\bin" 2>nul
          echo.

          mkdir "%DIST_DIR%"

          copy "%REL_DIR%\php.exe" "%DIST_DIR%\"
          copy "%REL_DIR%\php-cgi.exe" "%DIST_DIR%\"
          copy "%REL_DIR%\php8ts.dll" "%DIST_DIR%\"
          copy "%REL_DIR%\php8apache2_4.dll" "%DIST_DIR%\"
          copy "%REL_DIR%\php8ts.pdb" "%DIST_DIR%\"  2>nul
          copy "%REL_DIR%\php.pdb" "%DIST_DIR%\"  2>nul

          mkdir "%DIST_DIR%\ext"
          REM Extensions are in Release_TS root (php_*.dll), NOT in ext/ subdir
          copy "%REL_DIR%\php_*.dll" "%DIST_DIR%\ext\"  2>nul

          REM Dependency DLLs (icudt77.dll, libcrypto-4-x64.dll, libssl-*.dll, brotli*.dll, etc.)
          REM are in deps\bin\ (downloaded by phpsdk_deps)
          set "DEPS_BIN_DIR=${{ github.workspace }}\php-src\deps\bin"
          if not exist "%DEPS_BIN_DIR%\" set "DEPS_BIN_DIR=${{ github.workspace }}\deps\bin"
          if exist "%DEPS_BIN_DIR%\" (
            echo Copying dependency DLLs from: %DEPS_BIN_DIR%
            copy "%DEPS_BIN_DIR%\*.dll" "%DIST_DIR%\"  2>nul
          ) else (
            echo WARNING: deps\bin not found, dependency DLLs may be missing
            REM Try copying any *.dll directly from Release_TS as fallback
            copy "%REL_DIR%\libcrypto-*.dll" "%DIST_DIR%\"  2>nul
            copy "%REL_DIR%\libssl-*.dll" "%DIST_DIR%\"  2>nul
            copy "%REL_DIR%\icu*.dll" "%DIST_DIR%\"  2>nul
            copy "%REL_DIR%\lib*.dll" "%DIST_DIR%\"  2>nul
          )

          copy "${{ github.workspace }}\php-src\php.ini-development" "%DIST_DIR%\"
          copy "${{ github.workspace }}\php-src\php.ini-production" "%DIST_DIR%\"
          copy "${{ github.workspace }}\php-src\LICENSE" "%DIST_DIR%\LICENSE.txt"  2>nul
          copy "${{ github.workspace }}\php-src\NEWS" "%DIST_DIR%\NEWS.txt"  2>nul
          copy "${{ github.workspace }}\php-src\README.md" "%DIST_DIR%\README.md"  2>nul

          cd ${{ github.workspace }}
          7z a -tzip "%DIST_NAME%.zip" "%DIST_NAME%" -mx9
          dir "%DIST_NAME%.zip"

      - name: Package devel pack (x64 TS only)
        if: ${{ matrix.arch == 'x64' && matrix.avx == 'no' && !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        shell: cmd
        run: |
          set SRC_DIR=${{ github.workspace }}\php-src
          set BUILD_DIR=${{ github.workspace }}\php-src\x64\Release_TS
          set DEVEL_NAME=php-devel-pack-${{ env.PHP_VERSION }}-ts-Win32-vs18-x64
          set DEVEL_DIR=${{ github.workspace }}\%DEVEL_NAME%

          mkdir "%DEVEL_DIR%"
          mkdir "%DEVEL_DIR%\include"
          mkdir "%DEVEL_DIR%\lib"
          mkdir "%DEVEL_DIR%\build"

          echo === Copying PHP core headers ===
          xcopy "%SRC_DIR%\main" "%DEVEL_DIR%\include\main\" /E /I /Q /Y
          xcopy "%SRC_DIR%\Zend" "%DEVEL_DIR%\include\Zend\" /E /I /Q /Y
          xcopy "%SRC_DIR%\TSRM" "%DEVEL_DIR%\include\TSRM\" /E /I /Q /Y

          echo === Copying extension headers (.h only) ===
          robocopy "%SRC_DIR%\ext" "%DEVEL_DIR%\include\ext" *.h /S /E /NFL /NDL /NJH /NJS /NP /R:0 /W:0
          if errorlevel 8 (echo WARNING: some ext headers may not have copied)

          echo === Copying .lib files ===
          copy "%BUILD_DIR%\php8ts.lib" "%DEVEL_DIR%\lib\" >nul 2>&1
          if not exist "%DEVEL_DIR%\lib\php8ts.lib" (
            echo ERROR: php8ts.lib not found in %BUILD_DIR%
            dir "%BUILD_DIR%\*.lib" 2>nul
            exit /b 1
          )
          copy "%BUILD_DIR%\php_*.lib" "%DEVEL_DIR%\lib\" >nul 2>&1
          dir "%DEVEL_DIR%\lib\"

          echo === Copying build templates ===
          copy "%SRC_DIR%\win32\build\gen_stub.php" "%DEVEL_DIR%\build\" >nul 2>&1
          copy "%SRC_DIR%\win32\build\default.manifest" "%DEVEL_DIR%\build\" >nul 2>&1
          copy "%SRC_DIR%\win32\build\template.rc" "%DEVEL_DIR%\build\" >nul 2>&1

          echo === Copying phpize.bat ===
          copy "%SRC_DIR%\win32\build\phpize.bat" "%DEVEL_DIR%\" >nul 2>&1

          echo === Copying script/ (generated by buildconf + configure) ===
          if exist "%SRC_DIR%\script" (
            xcopy "%SRC_DIR%\script" "%DEVEL_DIR%\script\" /E /I /Q /Y
          ) else (
            echo WARNING: php-src/script/ not found - phpize may not work
            echo Falling back to copying from win32/build/
            mkdir "%DEVEL_DIR%\script"
            copy "%SRC_DIR%\win32\build\confutils.js" "%DEVEL_DIR%\script\" >nul 2>&1
          )

          echo === Archiving devel pack ===
          cd ${{ github.workspace }}
          7z a -tzip "%DEVEL_NAME%.zip" "%DEVEL_NAME%" -mx9
          dir "%DEVEL_NAME%.zip"

      - name: Upload devel pack artifact (x64 TS only)
        if: ${{ matrix.arch == 'x64' && matrix.avx == 'no' && !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/upload-artifact@v7
        with:
          name: php-devel-pack-${{ env.PHP_VERSION }}-ts-Win32-vs18-x64
          path: ${{ github.workspace }}/php-devel-pack-*.zip
          retention-days: 90

      - name: Upload build artifact
        if: ${{ !(matrix.avx == 'yes' && !inputs.include_avx2) && !(matrix.arch == 'x86' && !inputs.include_x86) }}
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ env.PHP_VERSION }}-ts-Win32-vs18-${{ matrix.arch }}${{ matrix.avx_suffix }}
          path: ${{ github.workspace }}/php-*.zip
          retention-days: 90

      - name: Write build metadata (consumed by the release job)
        if: ${{ matrix.arch == 'x64' && matrix.avx == 'no' }}
        shell: pwsh
        run: |
          $meta = "PHP_VERSION=${{ env.PHP_VERSION }}`nPHP_REF=${{ inputs.php_ref }}`n"
          [System.IO.File]::WriteAllText("${{ github.workspace }}\build-meta.env", $meta)
          Write-Host "build-meta.env:"
          Get-Content "${{ github.workspace }}\build-meta.env"

      - name: Upload build metadata
        if: ${{ matrix.arch == 'x64' && matrix.avx == 'no' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-meta
          path: ${{ github.workspace }}/build-meta.env
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Consolidate zip files
        run: |
          mkdir -p release_assets
          find artifacts -name "php-*.zip" -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate release metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_TIME=$(date -u +'%H:%M UTC')
          PHP_VERSION=$(grep -oP '^PHP_VERSION=\K.*' artifacts/build-meta/build-meta.env)
          PHP_REF=$(grep -oP '^PHP_REF=\K.*' artifacts/build-meta/build-meta.env)
          TAG="php-${PHP_VERSION}-${BUILD_DATE}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "php_version=${PHP_VERSION}" >> $GITHUB_OUTPUT
          echo "php_ref=${PHP_REF}" >> $GITHUB_OUTPUT
          PHP_COMMIT=$(curl -s "https://api.github.com/repos/php/php-src/commits/${PHP_REF}" | grep -oE '"sha":"[a-f0-9]+"' | head -1 | cut -d'"' -f4)
          echo "php_commit=${PHP_COMMIT:0:12}" >> $GITHUB_OUTPUT
          echo "php_commit_full=${PHP_COMMIT}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: PHP ${{ steps.meta.outputs.php_version }} TS Windows VS18 - ${{ steps.meta.outputs.build_date }}
          body: |
            # PHP ${{ steps.meta.outputs.php_version }} - Thread Safe Windows Build (VS2024)

            | Field | Value |
            |---|---|
            | **Build date** | ${{ steps.meta.outputs.build_date }} ${{ steps.meta.outputs.build_time }} |
            | **Source ref** | `${{ steps.meta.outputs.php_ref }}` |
            | **PHP source commit** | [${{ steps.meta.outputs.php_commit }}](https://github.com/php/php-src/commit/${{ steps.meta.outputs.php_commit_full }}) |
            | **Compiler** | Visual Studio 2024 (VC18, vs18) |
            | **Build type** | Thread Safe (ZTS) - for Apache mod_php and XAMPP |
            | **Architectures** | x86, x64 + AVX2 variants |

            ## Downloads

            Each zip is a **complete PHP distribution** - ready to extract and use.

            | Asset | Architecture | Optimization |
            |---|---|---|
            | `php-${{ steps.meta.outputs.php_version }}-ts-Win32-vs18-x64.zip` | x64 | Standard |
            | `php-${{ steps.meta.outputs.php_version }}-ts-Win32-vs18-x86.zip` | x86 | Standard |
            | `php-${{ steps.meta.outputs.php_version }}-ts-Win32-vs18-x64-AVX2.zip` | x64 | AVX2 |
            | `php-${{ steps.meta.outputs.php_version }}-ts-Win32-vs18-x86-AVX2.zip` | x86 | AVX2 |
            | `php-devel-pack-${{ steps.meta.outputs.php_version }}-ts-Win32-vs18-x64.zip` | x64 | Devel pack (headers + libs + phpize) |

            ## Contents

            - php.exe, php-cgi.exe (CLI + FastCGI)
            - php8ts.dll (TS engine for Apache mod_php)
            - php8apache2_4.dll (Apache 2.4 module)
            - ext/*.dll (40+ extensions: mysqli, opcache, curl, gd, intl, etc.)
            - **Devel pack** (for building PECL extensions: headers, .lib files, phpize.bat)
            - Dependency DLLs (libcrypto, libssl, icu)
            - php.ini-development, php.ini-production

            ## Installation (XAMPP)

            1. Download x64-AVX2.zip for best performance on modern CPUs
            2. Stop Apache
            3. Replace php8ts.dll, php8apache2_4.dll, php.exe, ext/ in C:\\xampp\\php\\
            4. Start Apache
            5. Verify: C:\\xampp\\php\\php.exe -v

            ## Features

            This build tracks the php/php-src **${{ steps.meta.outputs.php_ref }}** ref. See the linked source commit above for the exact feature set -- master snapshots contain the newest, unreleased PHP features.

            ## Source

            - Built from: https://github.com/php/php-src (ref: ${{ steps.meta.outputs.php_ref }})
            - Commit: ${{ steps.meta.outputs.php_commit_full }}
            - PHP SDK: https://github.com/php/php-sdk-binary-tools
            - Compiler: VS2024 (vs18) on windows-2025 runner
            - AVX2 via: --enable-native-intrinsics=avx2

            ---

            *Automated build via workflow `build-php-dev-latest.yaml`.*
          files: release_assets/*.zip
          generate_release_notes: false
          draft: false
          prerelease: true
