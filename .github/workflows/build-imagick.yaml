name: Build Imagick PHP VS18 x64 (from own releases)

# ============================================================================
# ROOT CAUSE (verified directly against php-src win32/build/confutils.js and
# imagick's own config.w32 -- not a guess):
#
#   imagick's config.w32 looks for ImageMagick in exactly two places:
#     1) <php-devel-pack>\include\imagemagick\MagickWand\MagickWand.h
#        <php-devel-pack>\lib\imagemagick\CORE_RL_MagickWand_.lib
#     2) <path passed to --with-imagick>\MagickWand\MagickWand.h   (directly!)
#        <path passed to --with-imagick>\lib\CORE_RL_MagickWand_.lib
#
#   Every previous version of this workflow built ImageMagick's dev tree as
#     C:\ImageMagick\include\imagemagick\MagickWand\MagickWand.h
#     C:\ImageMagick\lib\imagemagick\CORE_RL_MagickWand_.lib
#   ...which matches NEITHER of the two locations above. So config.w32 prints
#   "WARNING: imagick not enabled; libraries and headers not found", never
#   calls EXTENSION('imagick', ...), imagick never enters the Makefile, and
#   nmake "succeeds" because it has nothing to build. No compiler error is
#   ever produced -- that's why php_imagick.dll was always silently missing.
#
#   Fix: ImageMagick's headers now go directly under C:\ImageMagick (so
#   C:\ImageMagick\MagickWand\MagickWand.h exists) and libs go directly under
#   C:\ImageMagick\lib\ (so C:\ImageMagick\lib\CORE_RL_MagickWand_.lib
#   exists). --with-imagick="C:\ImageMagick" then matches location #2 above.
#
#   A hard fail-fast check right after configure.bat now greps its output
#   for "Enabling extension imagick" and aborts immediately with a clear
#   diagnostic if it's missing, instead of silently reaching nmake and only
#   discovering the problem minutes later when the DLL search comes up empty.
#
#   The zend_is_callable -> zend_is_callable_ex patch (required because PHP
#   8.6 made zend_is_callable a non-exported static inline function; the
#   patch applies to PHP 8.6, 8.7 and every later version) is already
#   correctly applied in the vendored imagick source and is left untouched.
#   This was never the problem.
# ============================================================================
#
# BEFORE RUNNING THIS WORKFLOW, upload this ONE file into your repo:
#
#   vendor/imagick-patched.zip   <- your already-patched imagick source (~570 KB)
#
# This is the exact file you already have locally. Using a vendored copy
# instead of re-cloning/re-patching from GitHub at runtime removes upstream
# repo changes and regex-patch drift as failure sources.
#
# The PHP SDK is NOT vendored (it's ~35 MB, over GitHub's 25 MB web-upload
# limit) -- it's downloaded fresh from github.com/php/php-sdk-binary-tools
# on every run instead, which has never failed in any prior run.

on:
  workflow_dispatch:
    inputs:
      build_ts:
        description: "Build Thread-Safe (TS) variant"
        type: boolean
        default: true
      build_nts:
        description: "Build Non-Thread-Safe (NTS) variant"
        type: boolean
        default: true
      php_release:
        description: "Own-repo PHP release the TS variant builds against: 'latest' (newest php-* release with assets), a series ('8.6', '8.7') or an exact tag ('php-8.6.0RC2')"
        type: string
        default: "latest"
      qa_version:
        description: "Full version of the official php.net QA build used for the NTS variant and as the script/ base for TS (e.g. 8.6.0RC2)"
        type: string
        default: "8.6.0RC2"

permissions:
  contents: read

env:
  IMAGEMAGICK_VERSION: "7.1.1-47"

jobs:

  # ============================================================
  # BUILD THREAD SAFE
  # ============================================================

  build-ts:
    if: ${{ inputs.build_ts }}
    name: Build Imagick PHP TS x64${{ matrix.avx == 'avx2' && '-AVX2' || '' }}
    runs-on: windows-2025
    outputs:
      php_series: ${{ steps.select_release.outputs.php_series }}
      release_tag: ${{ steps.select_release.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        avx: ['', 'avx2']

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify vendored imagick source is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = "vendor\imagick-patched.zip"
          if (-not (Test-Path $f)) {
              throw "Missing required vendored file: $f -- upload it to the repo first (see comments at the top of this workflow)."
          }
          Write-Host "Found: $f"

      # --------------------------------------------------------
      # Downloads (PHP SDK from GitHub + PHP binary/devel pack from
      # own releases + ImageMagick deps from php.net).
      # --------------------------------------------------------

      - name: Download PHP TS binary + devel pack from own releases
        id: select_release
        shell: pwsh
        env:
          IMAGEMAGICK_VERSION: "7.1.1-47"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FileWithRetry {
              param([string]$Url, [string]$OutFile, [int]$Retries = 5)

              for ($i = 1; $i -le $Retries; $i++) {
                  try {
                      Write-Host "[$i/$Retries] Downloading: $Url"
                      Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -MaximumRedirection 10

                      if (-not (Test-Path $OutFile)) { throw "File was not written." }
                      $size = (Get-Item $OutFile).Length
                      if ($size -lt 10000) { throw "Downloaded file is suspiciously small ($size bytes) - likely an error page, not a real archive." }

                      Add-Type -AssemblyName System.IO.Compression.FileSystem
                      $zip = [System.IO.Compression.ZipFile]::OpenRead($OutFile)
                      $zip.Dispose()

                      Write-Host "OK ($size bytes)."
                      return
                  } catch {
                      Write-Host "Attempt $i failed: $($_.Exception.Message)"
                      if (Test-Path $OutFile) { Remove-Item $OutFile -Force }
                      if ($i -lt $Retries) { Start-Sleep -Seconds (5 * $i) }
                  }
              }
              throw "Failed to download a valid archive from $Url after $Retries attempts."
          }

          # Select the own-repo release to build the TS variant against,
          # per the php_release input:
          #   'latest'       -> newest php-* release that has assets
          #   '8.6' / '8.7'  -> newest release of that series (tag prefix php-8.6.)
          #   'php-8.6.0RC2' -> that exact tag
          $headers = @{ "Authorization" = "Bearer $env:GH_TOKEN"; "Accept" = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/markusfoo/php-windows-builds/releases?per_page=30" -Headers $headers
          $candidates = $releases | Where-Object { $_.prerelease -and $_.assets.Count -gt 0 -and $_.tag_name -match '^php-' }
          if (-not $candidates) { throw "No php-* release with assets found in markusfoo/php-windows-builds - run the build-php-dev-latest workflow first." }

          $wanted = "${{ inputs.php_release }}"
          if ($wanted -eq "latest") {
              $release = $candidates | Select-Object -First 1
          } else {
              $prefix = if ($wanted -match '^php-') { $wanted } else { "php-$wanted" }
              $release = $candidates | Where-Object { $_.tag_name -eq $wanted -or $_.tag_name.StartsWith("$prefix.") } | Select-Object -First 1
              if (-not $release) { throw "No own-repo release matches php_release='$wanted'. Available: $($candidates.tag_name -join ', ')" }
          }

          # Derive the PHP series from the selected tag (php-8.7.0-dev-2026-09-26 -> 8.7)
          # so artifact and release naming always reflects what was ACTUALLY built.
          $phpSeries = (($release.tag_name -replace '^php-', '') -split '\.' | Select-Object -First 2) -join '.'
          Write-Host "Using release: $($release.tag_name) ($($release.assets.Count) assets) -> PHP series $phpSeries"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "php_series=$phpSeries"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$($release.tag_name)"

          # Find the right assets
          $phpBin = $release.assets | Where-Object { $_.name -match '^php-.*-ts-Win32-vs18-x64\.zip$' -and $_.name -notmatch 'AVX2' -and $_.name -notmatch 'devel' } | Select-Object -First 1
          $develPack = $release.assets | Where-Object { $_.name -match 'devel' } | Select-Object -First 1

          if (-not $phpBin) { throw "PHP TS x64 binary not found in release $($release.tag_name). Available: $($release.assets | ForEach-Object { $_.name })" }
          if (-not $develPack) { throw "Devel pack not found in release $($release.tag_name). Available: $($release.assets | ForEach-Object { $_.name })" }

          Write-Host "PHP binary: $($phpBin.name) ($([math]::Round($phpBin.size/1MB, 1)) MB)"
          Write-Host "Devel pack: $($develPack.name) ($([math]::Round($develPack.size/1MB, 1)) MB)"

          Get-FileWithRetry -Url $phpBin.browser_download_url -OutFile "php-ts.zip"
          Get-FileWithRetry -Url $develPack.browser_download_url -OutFile "php-devel.zip"

          # Our custom devel pack is missing script/ (phpize.js etc.) because
          # buildconf doesn't generate it for dev builds. Download the official
          # QA devel pack to steal its script/ directory.
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-devel-pack-${{ inputs.qa_version }}-Win32-vs18-x64.zip" -OutFile "php-devel-official.zip"

          # ImageMagick deps from php.net PECL (unchanged)
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip" -OutFile "imagemagick.zip"

      # --------------------------------------------------------
      # Download + extract PHP SDK from GitHub
      # --------------------------------------------------------

      - name: Download and extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 5; $i++) {
              try {
                  Write-Host "[$i/5] Downloading PHP SDK from GitHub..."
                  Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile "sdk.zip" -UseBasicParsing
                  break
              } catch {
                  Write-Host "Attempt $i failed: $($_.Exception.Message)"
                  if ($i -eq 5) { throw "Failed to download PHP SDK from GitHub after 5 attempts." }
                  Start-Sleep -Seconds (5 * $i)
              }
          }

          if (Test-Path "C:\php-sdk") { Remove-Item "C:\php-sdk" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\php-sdk-extract" -Force | Out-Null
          Expand-Archive -Path "sdk.zip" -DestinationPath "C:\php-sdk-extract" -Force

          $root = Get-ChildItem -Path "C:\php-sdk-extract" -Directory | Select-Object -First 1
          if (-not $root) { throw "PHP SDK archive root was not found." }
          Move-Item -Path $root.FullName -Destination "C:\php-sdk" -Force

          $starter = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "phpsdk-vs18-x64.bat" | Select-Object -First 1
          if (-not $starter) { throw "phpsdk-vs18-x64.bat not found in downloaded SDK." }

          $bison = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "bison.exe" | Select-Object -First 1
          if (-not $bison) { throw "bison.exe not found in downloaded SDK." }

          Write-Host "SDK starter: $($starter.FullName)"
          Write-Host "bison.exe:   $($bison.FullName)"

      # --------------------------------------------------------
      # Extract vendored, already-patched imagick source
      # --------------------------------------------------------

      - name: Extract imagick source (vendored, pre-patched) - TS copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-ts") { Remove-Item "C:\imagick-ts" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\imagick-ts-raw" -Force | Out-Null

          Expand-Archive -Path "vendor\imagick-patched.zip" -DestinationPath "C:\imagick-ts-raw" -Force

          $configw32 = Get-ChildItem -Path "C:\imagick-ts-raw" -Recurse -Filter "config.w32" | Select-Object -First 1
          if (-not $configw32) { throw "config.w32 not found inside vendored imagick source zip." }

          Move-Item -Path $configw32.Directory.FullName -Destination "C:\imagick-ts" -Force

          Write-Host "imagick source root: C:\imagick-ts"

      - name: Verify PHP 8.6+ compatibility patch is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\imagick-ts\imagick_class.c"
          if (-not (Test-Path $source)) { throw "imagick_class.c not found." }

          $text = Get-Content -Path $source -Raw

          if ($text.Contains('zend_is_callable(user_callback, 0, NULL TSRMLS_CC)')) {
              throw "The OLD zend_is_callable() call is still present - this build will fail to link against a PHP 8.6+ php8ts.dll. The vendored zip is not actually patched."
          }

          if (-not $text.Contains('zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)')) {
              throw "The PHP 8.6+ compatibility patch (zend_is_callable_ex) was not found. The vendored zip is not actually patched."
          }

          Write-Host "PHP 8.6+ compatibility patch confirmed present."

      # --------------------------------------------------------
      # Extract PHP binary + devel pack
      # --------------------------------------------------------

      - name: Extract PHP TS binary + devel pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin")   { Remove-Item "C:\php-bin" -Recurse -Force }
          if (Test-Path "C:\php-devel") { Remove-Item "C:\php-devel" -Recurse -Force }

          # === PHP binary from our own release ===
          New-Item -ItemType Directory -Path "C:\php-bin" -Force | Out-Null
          Expand-Archive -Path "php-ts.zip" -DestinationPath "C:\php-bin" -Force

          # Our release zips wrap contents in a subdirectory. Flatten if needed.
          $php = "C:\php-bin\php.exe"
          if (-not (Test-Path $php)) {
              $found = Get-ChildItem -Path "C:\php-bin" -Recurse -Filter "php.exe" | Select-Object -First 1
              if (-not $found) { throw "php.exe not found anywhere in the extracted PHP TS binary." }
              $innerDir = $found.Directory.FullName
              Write-Host "Flattening: php.exe is in $innerDir, moving contents to C:\php-bin"
              Get-ChildItem -Path $innerDir | Move-Item -Destination "C:\php-bin" -Force
              if ((Get-ChildItem -Path $innerDir -ErrorAction SilentlyContinue).Count -eq 0) {
                  Remove-Item $innerDir -Force
              }
          }
          $php = "C:\php-bin\php.exe"
          if (-not (Test-Path $php)) { throw "php.exe not found after extracting PHP TS binary." }
          & $php -v

          # === Devel pack: use OFFICIAL QA as base, overlay our custom lib/ ===
          # Our custom devel pack is incomplete (missing script/, win32/ headers).
          # The official QA pack has everything needed for compilation.
          # Strategy: extract official pack -> C:\php-devel, then replace lib/ with
          # our custom lib/ (so .lib files match our exact dev binary).
          Write-Host ""
          Write-Host "=== Extracting OFFICIAL QA devel pack as base ==="
          New-Item -ItemType Directory -Path "C:\php-devel-official-extract" -Force | Out-Null
          Expand-Archive -Path "php-devel-official.zip" -DestinationPath "C:\php-devel-official-extract" -Force

          # Official packs have a subdirectory wrapper. Find phpize.bat and flatten.
          $phpize = Get-ChildItem -Path "C:\php-devel-official-extract" -Recurse -Filter "phpize.bat" | Select-Object -First 1
          if (-not $phpize) { throw "phpize.bat not found in the official QA devel pack." }
          $officialDevelDir = $phpize.Directory.FullName
          Write-Host "Official devel pack root: $officialDevelDir"

          Move-Item -Path $officialDevelDir -Destination "C:\php-devel" -Force

          # Verify the official pack has what we need
          if (-not (Test-Path "C:\php-devel\phpize.bat")) { throw "phpize.bat not at C:\php-devel\phpize.bat" }
          if (-not (Test-Path "C:\php-devel\script\phpize.js")) { throw "script/phpize.js missing from official pack." }
          if (-not (Test-Path "C:\php-devel\include\main\php.h")) {
              Write-Host "WARNING: include/main/php.h not directly present, checking subdirs..."
              $h = Get-ChildItem -Path "C:\php-devel" -Recurse -Filter "php.h" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\main\\' } | Select-Object -First 1
              if (-not $h) { throw "php.h not found in official devel pack." }
              $innerInclude = $h.Directory.Parent.FullName
              if (-not (Test-Path "C:\php-devel\include")) {
                  Move-Item -Path $innerInclude -Destination "C:\php-devel\include" -Force
              }
          }

          Write-Host "Official pack verified. Contents:"
          Write-Host "  phpize.bat:  $(Test-Path 'C:\php-devel\phpize.bat')"
          Write-Host "  script/:     $(Test-Path 'C:\php-devel\script')"
          Write-Host "  include/:    $(Test-Path 'C:\php-devel\include')"
          Write-Host "  lib/:        $(Test-Path 'C:\php-devel\lib')"
          Write-Host "  build/:      $(Test-Path 'C:\php-devel\build')"

          # === Overlay our custom lib/ (matching .lib files for our dev binary) ===
          Write-Host ""
          Write-Host "=== Overlaying custom lib/ from our release devel pack ==="
          New-Item -ItemType Directory -Path "C:\php-devel-custom-extract" -Force | Out-Null
          Expand-Archive -Path "php-devel.zip" -DestinationPath "C:\php-devel-custom-extract" -Force

          $customPhpize = Get-ChildItem -Path "C:\php-devel-custom-extract" -Recurse -Filter "phpize.bat" | Select-Object -First 1
          if (-not $customPhpize) { throw "phpize.bat not found in our custom devel pack." }
          $customDevelDir = $customPhpize.Directory.FullName
          $customLib = "$customDevelDir\lib"
          if (-not (Test-Path $customLib)) { throw "lib/ not found in our custom devel pack." }

          Write-Host "Custom lib contents:"
          Get-ChildItem -Path $customLib -File | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB, 0)) KB)" }

          # Overlay our custom include/ on top of the official pack. The
          # headers MUST come from the exact PHP we build against: PHP checks
          # ZEND_MODULE_API_NO at extension load time (8.6 = 20260924,
          # 8.7.0-dev = 20260925), so a DLL compiled against the QA headers
          # of a different series would fail to load. Merging (not replacing)
          # keeps official-only extras (script/, win32/) that our pack does
          # not ship.
          $customInclude = "$customDevelDir\include"
          if (-not (Test-Path $customInclude)) { throw "include/ not found in our custom devel pack." }
          Copy-Item -Path "$customInclude\*" -Destination "C:\php-devel\include" -Recurse -Force
          Write-Host "Overlaid custom include/ - headers now match the selected own release"

          # Replace the official lib/ with our custom one (php8ts.lib must
          # match the exact binary we are building against)
          if (Test-Path "C:\php-devel\lib") { Remove-Item "C:\php-devel\lib" -Recurse -Force }
          Copy-Item -Path $customLib -Destination "C:\php-devel\lib" -Recurse -Force

          # Final verification
          $tsLib = "C:\php-devel\lib\php8ts.lib"
          if (-not (Test-Path $tsLib)) { throw "php8ts.lib not found after lib overlay. Our custom devel pack may not have it." }
          Write-Host ""
          Write-Host "=== Final C:\php-devel structure ==="
          Write-Host "  phpize.bat:  OK"
          Write-Host "  script/:     OK ($(Get-ChildItem 'C:\php-devel\script' -File | Measure-Object).Count files)"
          Write-Host "  include/:    OK"
          Write-Host "  lib/:        OK ($(Get-ChildItem 'C:\php-devel\lib' -File | Measure-Object).Count files)"
          Write-Host "  php8ts.lib: OK ($([math]::Round((Get-Item $tsLib).Length/1MB, 2)) MB)"

      - name: Prepare ImageMagick development files (fixed layout)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw   = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw)   { Remove-Item $raw -Recurse -Force }
          if (Test-Path $final) { Remove-Item $final -Recurse -Force }

          New-Item -ItemType Directory -Path $raw -Force | Out-Null
          New-Item -ItemType Directory -Path $final -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\bin" -Force | Out-Null

          Expand-Archive -Path "imagemagick.zip" -DestinationPath $raw -Force

          $header = Get-ChildItem -Path $raw -Recurse -Filter "MagickWand.h" |
              Where-Object { $_.FullName -match "\\MagickWand\\MagickWand\.h$" } |
              Select-Object -First 1

          if (-not $header) {
              Write-Host "ImageMagick archive structure:"
              Get-ChildItem -Path $raw -Recurse -File | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
              throw "MagickWand.h was not found anywhere in the ImageMagick archive."
          }

          # The folder that DIRECTLY contains MagickWand\, MagickCore\, wand\, etc.
          $includeRoot = $header.Directory.Parent.FullName
          Write-Host "ImageMagick include root in archive: $includeRoot"

          # THE FIX: copy directly into C:\ImageMagick (no extra
          # "include\imagemagick" nesting). imagick's config.w32 looks for
          # "<--with-imagick path>\MagickWand\MagickWand.h" literally.
          Copy-Item -Path "$includeRoot\*" -Destination $final -Recurse -Force

          # THE FIX: libs go directly under C:\ImageMagick\lib (flat).
          Get-ChildItem -Path $raw -Recurse -Filter "*.lib" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\lib" -Force
          }

          # Runtime DLLs
          Get-ChildItem -Path $raw -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\bin" -Force
          }

          $finalHeader = "$final\MagickWand\MagickWand.h"
          $finalWand   = "$final\lib\CORE_RL_MagickWand_.lib"
          $finalCore   = "$final\lib\CORE_RL_MagickCore_.lib"

          if (-not (Test-Path $finalHeader)) { throw "Final MagickWand.h is missing at $finalHeader" }
          if (-not (Test-Path $finalWand))   { throw "Final MagickWand import library is missing at $finalWand" }
          if (-not (Test-Path $finalCore))   { throw "Final MagickCore import library is missing at $finalCore" }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ImageMagick dev tree ready (fixed layout)"
          Write-Host "========================================"
          Write-Host "Header : $finalHeader"
          Write-Host "Lib    : $finalWand"
          Write-Host "Lib    : $finalCore"

      # --------------------------------------------------------
      # Build task
      # --------------------------------------------------------

      - name: Create TS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-ts"

          echo ========================================
          echo PHP TS x64 / Imagick
          echo ========================================
          echo PHP_DEV:      %PHP_DEV%
          echo IMAGEMAGICK:  %IMAGEMAGICK%
          echo SOURCE:       %SOURCE%

          where cl    >nul || (echo ERROR: cl.exe not found & exit /b 1)
          where link  >nul || (echo ERROR: link.exe not found & exit /b 1)
          where nmake >nul || (echo ERROR: nmake.exe not found & exit /b 1)

          if not exist "%PHP_DEV%\phpize.bat" (echo ERROR: phpize.bat missing & exit /b 1)
          if not exist "%PHP_DEV%\include\main\php.h" (echo ERROR: PHP headers missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\MagickWand\MagickWand.h" (echo ERROR: ImageMagick header missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib" (echo ERROR: ImageMagick lib missing & exit /b 1)

          cd /d "%SOURCE%"
          if errorlevel 1 (echo ERROR: cannot cd into source & exit /b 1)

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================
          call "%PHP_DEV%\phpize.bat"
          if errorlevel 1 (echo PHPIZE FAILED & exit /b 1)

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================
          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%" ${{ matrix.avx == 'avx2' && '--enable-native-intrinsics=avx2' || '' }} > configure-output.log 2>&1
          set "CONFIGURE_EXIT=%ERRORLEVEL%"
          type configure-output.log

          if not "%CONFIGURE_EXIT%"=="0" (
              echo.
              echo ========================================
              echo CONFIGURE FAILED
              echo ========================================
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK WAS ACTUALLY ENABLED
          echo ========================================
          findstr /C:"imagick" configure-output.log | findstr /C:"shared" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: config.w32 did NOT enable imagick.
              echo This means MagickWand.h or CORE_RL_MagickWand_.lib were
              echo not found at the expected path. Expected:
              echo   %IMAGEMAGICK%\MagickWand\MagickWand.h
              echo   %IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib
              echo.
              if exist config.log type config.log
              exit /b 1
          )
          echo Confirmed: imagick was enabled by configure.

          if not exist Makefile (echo ERROR: Makefile was not generated & exit /b 1)

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================
          nmake /nologo > nmake-ts.log 2>&1
          set "NMAKE_EXIT=%ERRORLEVEL%"
          type nmake-ts.log

          if not "%NMAKE_EXIT%"=="0" (
              echo.
              echo NMAKE FAILED
              exit /b %NMAKE_EXIT%
          )

          echo.
          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================
          set "FOUND_DLL="
          for /f "delims=" %%F in ('dir /s /b /a-d "%SOURCE%\php_imagick.dll" 2^>nul') do (
              set "FOUND_DLL=%%F"
              goto :dll_found
          )
          :dll_found

          if not defined FOUND_DLL (
              echo ERROR: php_imagick.dll was not produced despite imagick being enabled.
              dir /s /b *.dll *.obj *.lib 2>nul
              exit /b 1
          )

          echo Found: !FOUND_DLL!
          if /I not "!FOUND_DLL!"=="%SOURCE%\php_imagick.dll" (
              copy /y "!FOUND_DLL!" "%SOURCE%\php_imagick.dll" >nul
          )

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: final TS DLL missing after copy
              exit /b 1
          )

          echo.
          echo TS DLL READY: %SOURCE%\php_imagick.dll
          endlocal
          exit /b 0
          '@

          Set-Content -Path "C:\build-imagick-ts.bat" -Value $build -Encoding ASCII
          Write-Host "TS build task created."

      - name: Build Imagick TS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-ts.bat
          if errorlevel 1 exit /b 1

      # --------------------------------------------------------
      # Validate, load-test, package
      # --------------------------------------------------------

      - name: Validate + load-test TS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-ts\php_imagick.dll"
          if (-not (Test-Path $dll)) {
              Write-Host "Searching inside C:\imagick-ts only (not the whole C: drive):"
              Get-ChildItem -Path "C:\imagick-ts" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
              throw "TS php_imagick.dll was not produced."
          }

          Get-Item $dll | Format-List FullName, Length, LastWriteTime

          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              $dest = Join-Path "C:\php-bin" $_.Name
              if ([System.IO.Path]::GetFullPath($_.FullName) -ne [System.IO.Path]::GetFullPath($dest)) {
                  Copy-Item -Path $_.FullName -Destination $dest -Force
              }
          }
          Copy-Item -Path $dll -Destination "C:\php-bin\php_imagick.dll" -Force

          & "C:\php-bin\php.exe" -n -d "extension=C:\php-bin\php_imagick.dll" -r "echo 'PHP=',PHP_VERSION,PHP_EOL; echo 'ZTS=',(PHP_ZTS?'yes':'no'),PHP_EOL; echo 'Imagick=',(extension_loaded('imagick')?'OK':'FAILED'),PHP_EOL; echo 'ImageMagick=',Imagick::getVersion()['versionString'],PHP_EOL;"

          if ($LASTEXITCODE -ne 0) { throw "PHP TS failed to load php_imagick.dll." }
          Write-Host "TS VALIDATION SUCCESS."

      - name: Package TS artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "C:\artifact-ts" -Force | Out-Null
          Copy-Item -Path "C:\imagick-ts\php_imagick.dll" -Destination "C:\artifact-ts\php_imagick.dll" -Force
          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "C:\artifact-ts" -Force
          }
          Compress-Archive -Path "C:\artifact-ts\*" -DestinationPath "imagick-php${{ steps.select_release.outputs.php_series }}-vs18-x64-ts${{ matrix.avx == 'avx2' && '-AVX2' || '' }}.zip" -Force

      - name: Upload TS artifact
        uses: actions/upload-artifact@v6
        with:
          name: imagick-php${{ steps.select_release.outputs.php_series }}-vs18-x64-ts${{ matrix.avx == 'avx2' && '-AVX2' || '' }}
          path: imagick-php${{ steps.select_release.outputs.php_series }}-vs18-x64-ts${{ matrix.avx == 'avx2' && '-AVX2' || '' }}.zip
          if-no-files-found: error


  # ============================================================
  # BUILD NON-THREAD SAFE
  # ============================================================

  build-nts:
    if: ${{ inputs.build_nts }}
    name: Build Imagick PHP NTS x64${{ matrix.avx == 'avx2' && '-AVX2' || '' }}
    runs-on: windows-2025
    outputs:
      php_series: ${{ steps.nts_version.outputs.php_series }}
    strategy:
      fail-fast: false
      matrix:
        avx: ['', 'avx2']

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive PHP series from qa_version
        id: nts_version
        shell: pwsh
        run: |
          $v = "${{ inputs.qa_version }}"
          $phpSeries = ($v -split '\.' | Select-Object -First 2) -join '.'
          Write-Host "qa_version=$v -> PHP series $phpSeries"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "php_series=$phpSeries"

      - name: Verify vendored imagick source is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $f = "vendor\imagick-patched.zip"
          if (-not (Test-Path $f)) {
              throw "Missing required vendored file: $f -- upload it to the repo first (see comments at the top of this workflow)."
          }
          Write-Host "Found: $f"

      - name: Download PHP NTS binary + devel pack + ImageMagick deps
        shell: pwsh
        env:
          QA_VERSION: ${{ inputs.qa_version }}
          IMAGEMAGICK_VERSION: "7.1.1-47"
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FileWithRetry {
              param([string]$Url, [string]$OutFile, [int]$Retries = 5)

              for ($i = 1; $i -le $Retries; $i++) {
                  try {
                      Write-Host "[$i/$Retries] Downloading: $Url"
                      Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -MaximumRedirection 10

                      if (-not (Test-Path $OutFile)) { throw "File was not written." }
                      $size = (Get-Item $OutFile).Length
                      if ($size -lt 10000) { throw "Downloaded file is suspiciously small ($size bytes) - likely an error page, not a real archive." }

                      Add-Type -AssemblyName System.IO.Compression.FileSystem
                      $zip = [System.IO.Compression.ZipFile]::OpenRead($OutFile)
                      $zip.Dispose()

                      Write-Host "OK ($size bytes)."
                      return
                  } catch {
                      Write-Host "Attempt $i failed: $($_.Exception.Message)"
                      if (Test-Path $OutFile) { Remove-Item $OutFile -Force }
                      if ($i -lt $Retries) { Start-Sleep -Seconds (5 * $i) }
                  }
              }
              throw "Failed to download a valid archive from $Url after $Retries attempts."
          }

          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-$env:QA_VERSION-nts-Win32-vs18-x64.zip" -OutFile "php-nts.zip"
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/qa/php-devel-pack-$env:QA_VERSION-nts-Win32-vs18-x64.zip" -OutFile "php-devel-nts.zip"
          Get-FileWithRetry -Url "https://downloads.php.net/~windows/pecl/deps/ImageMagick-$env:IMAGEMAGICK_VERSION-vs17-x64.zip" -OutFile "imagemagick.zip"

      - name: Download and extract PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 5; $i++) {
              try {
                  Write-Host "[$i/5] Downloading PHP SDK from GitHub..."
                  Invoke-WebRequest -Uri "https://github.com/php/php-sdk-binary-tools/archive/refs/heads/master.zip" -OutFile "sdk.zip" -UseBasicParsing
                  break
              } catch {
                  Write-Host "Attempt $i failed: $($_.Exception.Message)"
                  if ($i -eq 5) { throw "Failed to download PHP SDK from GitHub after 5 attempts." }
                  Start-Sleep -Seconds (5 * $i)
              }
          }

          if (Test-Path "C:\php-sdk") { Remove-Item "C:\php-sdk" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\php-sdk-extract" -Force | Out-Null
          Expand-Archive -Path "sdk.zip" -DestinationPath "C:\php-sdk-extract" -Force

          $root = Get-ChildItem -Path "C:\php-sdk-extract" -Directory | Select-Object -First 1
          if (-not $root) { throw "PHP SDK archive root was not found." }
          Move-Item -Path $root.FullName -Destination "C:\php-sdk" -Force

          $starter = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "phpsdk-vs18-x64.bat" | Select-Object -First 1
          if (-not $starter) { throw "phpsdk-vs18-x64.bat not found in downloaded SDK." }

          $bison = Get-ChildItem -Path "C:\php-sdk" -Recurse -Filter "bison.exe" | Select-Object -First 1
          if (-not $bison) { throw "bison.exe not found in downloaded SDK." }

          Write-Host "SDK starter: $($starter.FullName)"
          Write-Host "bison.exe:   $($bison.FullName)"

      - name: Extract imagick source (vendored, pre-patched) - NTS copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\imagick-nts") { Remove-Item "C:\imagick-nts" -Recurse -Force }
          New-Item -ItemType Directory -Path "C:\imagick-nts-raw" -Force | Out-Null

          Expand-Archive -Path "vendor\imagick-patched.zip" -DestinationPath "C:\imagick-nts-raw" -Force

          $configw32 = Get-ChildItem -Path "C:\imagick-nts-raw" -Recurse -Filter "config.w32" | Select-Object -First 1
          if (-not $configw32) { throw "config.w32 not found inside vendored imagick source zip." }

          Move-Item -Path $configw32.Directory.FullName -Destination "C:\imagick-nts" -Force

          Write-Host "imagick source root: C:\imagick-nts"

      - name: Verify PHP 8.6+ compatibility patch is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "C:\imagick-nts\imagick_class.c"
          if (-not (Test-Path $source)) { throw "imagick_class.c not found." }

          $text = Get-Content -Path $source -Raw

          if ($text.Contains('zend_is_callable(user_callback, 0, NULL TSRMLS_CC)')) {
              throw "The OLD zend_is_callable() call is still present - the vendored zip is not actually patched."
          }
          if (-not $text.Contains('zend_is_callable_ex(user_callback, NULL, 0, NULL, NULL, NULL)')) {
              throw "The PHP 8.6+ compatibility patch (zend_is_callable_ex) was not found."
          }

          Write-Host "PHP 8.6+ compatibility patch confirmed present."

      - name: Extract PHP NTS binary + devel pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "C:\php-bin")   { Remove-Item "C:\php-bin" -Recurse -Force }
          if (Test-Path "C:\php-devel") { Remove-Item "C:\php-devel" -Recurse -Force }

          # --- PHP binary (QA zips are flat - php.exe at root) ---
          New-Item -ItemType Directory -Path "C:\php-bin" -Force | Out-Null
          Expand-Archive -Path "php-nts.zip" -DestinationPath "C:\php-bin" -Force

          $php = "C:\php-bin\php.exe"
          if (-not (Test-Path $php)) {
              # Safety: if QA format changed and now wraps in subdirectory, flatten it
              $found = Get-ChildItem -Path "C:\php-bin" -Recurse -Filter "php.exe" | Select-Object -First 1
              if (-not $found) { throw "php.exe not found anywhere in the extracted PHP NTS binary." }
              $innerDir = $found.Directory.FullName
              Write-Host "Flattening: php.exe is in $innerDir, moving contents to C:\php-bin"
              Get-ChildItem -Path $innerDir | Move-Item -Destination "C:\php-bin" -Force
              if ((Get-ChildItem -Path $innerDir -ErrorAction SilentlyContinue).Count -eq 0) {
                  Remove-Item $innerDir -Force
              }
          }
          $php = "C:\php-bin\php.exe"
          if (-not (Test-Path $php)) { throw "php.exe not found after extracting PHP NTS binary." }
          & $php -v

          # --- Devel pack (QA devel packs have a subdirectory wrapper) ---
          New-Item -ItemType Directory -Path "C:\php-devel-extract" -Force | Out-Null
          Expand-Archive -Path "php-devel-nts.zip" -DestinationPath "C:\php-devel-extract" -Force

          $phpize = Get-ChildItem -Path "C:\php-devel-extract" -Recurse -Filter "phpize.bat" | Select-Object -First 1
          if (-not $phpize) { throw "phpize.bat not found in the downloaded PHP NTS devel pack." }

          $develDir = $phpize.Directory.FullName
          Write-Host "Found phpize.bat in: $develDir"

          Move-Item -Path $develDir -Destination "C:\php-devel" -Force

          # Verify critical files at expected paths
          if (-not (Test-Path "C:\php-devel\phpize.bat")) { throw "phpize.bat not at C:\php-devel\phpize.bat" }
          if (-not (Test-Path "C:\php-devel\include\main\php.h")) {
              Write-Host "WARNING: C:\php-devel\include\main\php.h not found directly, checking subdirectories..."
              $h = Get-ChildItem -Path "C:\php-devel" -Recurse -Filter "php.h" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\main\\' } | Select-Object -First 1
              if (-not $h) { throw "php.h not found in the devel pack at all." }
              Write-Host "Found php.h at $($h.FullName), flattening include/ directory"
              $innerInclude = $h.Directory.Parent.FullName
              if (-not (Test-Path "C:\php-devel\include")) {
                  Move-Item -Path $innerInclude -Destination "C:\php-devel\include" -Force
              }
          }
          Write-Host "PHP devel pack root: C:\php-devel"
          Write-Host "PHP core headers confirmed at C:\php-devel\include\main\php.h"

      - name: Prepare ImageMagick development files (fixed layout)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $raw   = "C:\ImageMagickRaw"
          $final = "C:\ImageMagick"

          if (Test-Path $raw)   { Remove-Item $raw -Recurse -Force }
          if (Test-Path $final) { Remove-Item $final -Recurse -Force }

          New-Item -ItemType Directory -Path $raw -Force | Out-Null
          New-Item -ItemType Directory -Path $final -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\lib" -Force | Out-Null
          New-Item -ItemType Directory -Path "$final\bin" -Force | Out-Null

          Expand-Archive -Path "imagemagick.zip" -DestinationPath $raw -Force

          $header = Get-ChildItem -Path $raw -Recurse -Filter "MagickWand.h" |
              Where-Object { $_.FullName -match "\\MagickWand\\MagickWand\.h$" } |
              Select-Object -First 1

          if (-not $header) {
              Write-Host "ImageMagick archive structure:"
              Get-ChildItem -Path $raw -Recurse -File | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
              throw "MagickWand.h was not found anywhere in the ImageMagick archive."
          }

          $includeRoot = $header.Directory.Parent.FullName
          Write-Host "ImageMagick include root in archive: $includeRoot"

          Copy-Item -Path "$includeRoot\*" -Destination $final -Recurse -Force

          Get-ChildItem -Path $raw -Recurse -Filter "*.lib" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\lib" -Force
          }

          Get-ChildItem -Path $raw -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$final\bin" -Force
          }

          if (-not (Test-Path "$final\MagickWand\MagickWand.h")) { throw "Final MagickWand.h is missing." }
          if (-not (Test-Path "$final\lib\CORE_RL_MagickWand_.lib")) { throw "Final MagickWand import library is missing." }
          if (-not (Test-Path "$final\lib\CORE_RL_MagickCore_.lib")) { throw "Final MagickCore import library is missing." }

          Write-Host "ImageMagick dev tree ready (fixed layout)."

      - name: Create NTS build task
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          set "PHP_DEV=C:\php-devel"
          set "IMAGEMAGICK=C:\ImageMagick"
          set "SOURCE=C:\imagick-nts"

          echo ========================================
          echo PHP NTS x64 / Imagick
          echo ========================================

          where cl    >nul || (echo ERROR: cl.exe not found & exit /b 1)
          where link  >nul || (echo ERROR: link.exe not found & exit /b 1)
          where nmake >nul || (echo ERROR: nmake.exe not found & exit /b 1)

          if not exist "%PHP_DEV%\phpize.bat" (echo ERROR: phpize.bat missing & exit /b 1)
          if not exist "%PHP_DEV%\include\main\php.h" (echo ERROR: PHP headers missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\MagickWand\MagickWand.h" (echo ERROR: ImageMagick header missing & exit /b 1)
          if not exist "%IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib" (echo ERROR: ImageMagick lib missing & exit /b 1)

          cd /d "%SOURCE%"
          if errorlevel 1 (echo ERROR: cannot cd into source & exit /b 1)

          echo.
          echo ========================================
          echo PHPIZE
          echo ========================================
          call "%PHP_DEV%\phpize.bat"
          if errorlevel 1 (echo PHPIZE FAILED & exit /b 1)

          echo.
          echo ========================================
          echo CONFIGURE
          echo ========================================
          call configure.bat --with-php-build="%PHP_DEV%" --with-imagick="%IMAGEMAGICK%" --disable-zts ${{ matrix.avx == 'avx2' && '--enable-native-intrinsics=avx2' || '' }} > configure-output.log 2>&1
          set "CONFIGURE_EXIT=%ERRORLEVEL%"
          type configure-output.log

          if not "%CONFIGURE_EXIT%"=="0" (
              echo.
              echo ========================================
              echo CONFIGURE FAILED
              echo ========================================
              if exist config.log type config.log
              exit /b 1
          )

          echo.
          echo ========================================
          echo VERIFY IMAGICK WAS ACTUALLY ENABLED
          echo ========================================
          findstr /C:"imagick" configure-output.log | findstr /C:"shared" >nul
          if errorlevel 1 (
              echo.
              echo ERROR: config.w32 did NOT enable imagick.
              echo Expected:
              echo   %IMAGEMAGICK%\MagickWand\MagickWand.h
              echo   %IMAGEMAGICK%\lib\CORE_RL_MagickWand_.lib
              if exist config.log type config.log
              exit /b 1
          )
          echo Confirmed: imagick was enabled by configure.

          if not exist Makefile (echo ERROR: Makefile was not generated & exit /b 1)

          echo.
          echo ========================================
          echo NMAKE
          echo ========================================
          nmake /nologo > nmake-nts.log 2>&1
          set "NMAKE_EXIT=%ERRORLEVEL%"
          type nmake-nts.log

          if not "%NMAKE_EXIT%"=="0" (
              echo.
              echo NMAKE FAILED
              exit /b %NMAKE_EXIT%
          )

          echo.
          echo ========================================
          echo SEARCHING GENERATED DLL
          echo ========================================
          set "FOUND_DLL="
          for /f "delims=" %%F in ('dir /s /b /a-d "%SOURCE%\php_imagick.dll" 2^>nul') do (
              set "FOUND_DLL=%%F"
              goto :dll_found
          )
          :dll_found

          if not defined FOUND_DLL (
              echo ERROR: php_imagick.dll was not produced despite imagick being enabled.
              dir /s /b *.dll *.obj *.lib 2>nul
              exit /b 1
          )

          echo Found: !FOUND_DLL!
          if /I not "!FOUND_DLL!"=="%SOURCE%\php_imagick.dll" (
              copy /y "!FOUND_DLL!" "%SOURCE%\php_imagick.dll" >nul
          )

          if not exist "%SOURCE%\php_imagick.dll" (
              echo ERROR: final NTS DLL missing after copy
              exit /b 1
          )

          echo.
          echo NTS DLL READY: %SOURCE%\php_imagick.dll
          endlocal
          exit /b 0
          '@

          Set-Content -Path "C:\build-imagick-nts.bat" -Value $build -Encoding ASCII

      - name: Build Imagick NTS
        shell: cmd
        run: |
          call C:\php-sdk\phpsdk-vs18-x64.bat -t C:\build-imagick-nts.bat
          if errorlevel 1 exit /b 1

      - name: Validate + load-test NTS DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = "C:\imagick-nts\php_imagick.dll"
          if (-not (Test-Path $dll)) {
              Write-Host "Searching inside C:\imagick-nts only:"
              Get-ChildItem -Path "C:\imagick-nts" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
              throw "NTS php_imagick.dll was not produced."
          }

          Get-Item $dll | Format-List FullName, Length, LastWriteTime

          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              $dest = Join-Path "C:\php-bin" $_.Name
              if ([System.IO.Path]::GetFullPath($_.FullName) -ne [System.IO.Path]::GetFullPath($dest)) {
                  Copy-Item -Path $_.FullName -Destination $dest -Force
              }
          }
          Copy-Item -Path $dll -Destination "C:\php-bin\php_imagick.dll" -Force

          & "C:\php-bin\php.exe" -n -d "extension=C:\php-bin\php_imagick.dll" -r "echo 'PHP=',PHP_VERSION,PHP_EOL; echo 'ZTS=',(PHP_ZTS?'yes':'no'),PHP_EOL; echo 'Imagick=',(extension_loaded('imagick')?'OK':'FAILED'),PHP_EOL; echo 'ImageMagick=',Imagick::getVersion()['versionString'],PHP_EOL;"

          if ($LASTEXITCODE -ne 0) { throw "PHP NTS failed to load php_imagick.dll." }
          Write-Host "NTS VALIDATION SUCCESS."

      - name: Package NTS artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "C:\artifact-nts" -Force | Out-Null
          Copy-Item -Path "C:\imagick-nts\php_imagick.dll" -Destination "C:\artifact-nts\php_imagick.dll" -Force
          Get-ChildItem -Path "C:\ImageMagick\bin" -Filter "*.dll" -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "C:\artifact-nts" -Force
          }
          Compress-Archive -Path "C:\artifact-nts\*" -DestinationPath "imagick-php${{ steps.nts_version.outputs.php_series }}-vs18-x64-nts${{ matrix.avx == 'avx2' && '-AVX2' || '' }}.zip" -Force

      - name: Upload NTS artifact
        uses: actions/upload-artifact@v6
        with:
          name: imagick-php${{ steps.nts_version.outputs.php_series }}-vs18-x64-nts${{ matrix.avx == 'avx2' && '-AVX2' || '' }}
          path: imagick-php${{ steps.nts_version.outputs.php_series }}-vs18-x64-nts${{ matrix.avx == 'avx2' && '-AVX2' || '' }}.zip
          if-no-files-found: error


  # ============================================================
  # RELEASE JOB
  # ============================================================
  release:
    needs: [build-ts, build-nts]
    if: ${{ !cancelled() && (needs.build-ts.result == 'success' || needs.build-ts.result == 'skipped') && (needs.build-nts.result == 'success' || needs.build-nts.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Consolidate zip files
        run: |
          mkdir -p release_assets
          find artifacts -name "imagick-php*.zip" -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate release metadata
        id: meta
        run: |
          set -eu
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_TIME=$(date -u +'%H:%M UTC')

          # Derive everything from the assets that were ACTUALLY built -
          # never from a free-text input. One PHP series -> imagick-phpX.Y-*;
          # mixed series (TS and NTS from different series) -> an explicit
          # multi-version release.
          VERSIONS=$(ls release_assets | grep -oP '^imagick-php\K[0-9]+\.[0-9]+' | sort -u)
          VER_COUNT=$(printf '%s\n' "$VERSIONS" | grep -c . || true)
          if [ "$VER_COUNT" -eq 1 ]; then
            VER=$(printf '%s\n' "$VERSIONS")
            TAG="imagick-php${VER}-vs18-x64-${BUILD_DATE}"
            NAME="Imagick PHP ${VER} VS18 x64 - ${BUILD_DATE}"
          elif [ "$VER_COUNT" -gt 1 ]; then
            TAG="imagick-vs18-x64-${BUILD_DATE}"
            NAME="Imagick VS18 x64 (multi-version) - ${BUILD_DATE}"
          else
            echo "ERROR: no imagick-php*.zip assets found in release_assets/" >&2
            exit 1
          fi

          # Asset table generated from the real files
          ASSET_TABLE=""
          for f in release_assets/*.zip; do
            base=$(basename "$f" .zip)
            type="Thread Safe"
            case "$base" in *-nts-*) type="Non-Thread Safe";; esac
            opt="Standard"
            case "$base" in *-AVX2) opt="AVX2";; esac
            use="Apache mod_php / XAMPP"
            if [ "$type" = "Non-Thread Safe" ]; then use="IIS / Nginx FastCGI"; fi
            ASSET_TABLE="${ASSET_TABLE}| \`${base}.zip\` | ${type} | ${opt} | ${use} |"$'\n'
          done

          # Version line from what the build jobs actually used
          TS_TAG='${{ needs.build-ts.outputs.release_tag }}'
          TS_SERIES='${{ needs.build-ts.outputs.php_series }}'
          NTS_SERIES='${{ needs.build-nts.outputs.php_series }}'
          QA_VER='${{ inputs.qa_version }}'
          TS_PART=""
          if [ -n "$TS_TAG" ]; then TS_PART="**TS**: own release \`${TS_TAG}\` (PHP ${TS_SERIES})"; fi
          NTS_PART=""
          if [ -n "$NTS_SERIES" ]; then NTS_PART="**NTS**: official php.net QA \`php-${QA_VER}\` (PHP ${NTS_SERIES})"; fi
          if [ -n "$TS_PART" ] && [ -n "$NTS_PART" ]; then
            VERSION_LINE="${TS_PART} · ${NTS_PART}"
          elif [ -n "$TS_PART" ]; then
            VERSION_LINE="$TS_PART"
          elif [ -n "$NTS_PART" ]; then
            VERSION_LINE="$NTS_PART"
          else
            VERSION_LINE="none (both variants were disabled)"
          fi

          REQ_LINE="The TS DLL requires the TS PHP build it was compiled against; the NTS DLL requires the official php-${QA_VER} NTS build or a newer one of the same series."

          {
            echo "tag_name=${TAG}"
            echo "name=${NAME}"
            echo "build_date=${BUILD_DATE}"
            echo "build_time=${BUILD_TIME}"
            echo "version_line<<METADATA_EOF"
            printf '%s' "$VERSION_LINE"
            echo ""
            echo "METADATA_EOF"
            echo "requirement_line<<METADATA_EOF"
            printf '%s' "$REQ_LINE"
            echo ""
            echo "METADATA_EOF"
            echo "asset_table<<METADATA_EOF"
            printf '%s' "$ASSET_TABLE"
            echo "METADATA_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            # Imagick extension for PHP - VS2024 x64 builds

            | Field | Value |
            |---|---|
            | **Build date** | ${{ steps.meta.outputs.build_date }} ${{ steps.meta.outputs.build_time }} |
            | **Compiler** | Visual Studio 2024 (VC18, vs18) |
            | **Runner** | windows-2025 |
            | **PHP version** | ${{ steps.meta.outputs.version_line }} |
            | **ImageMagick** | 7.1.1-47 |
            | **Variants** | TS + NTS + AVX2 |

            ## Downloads

            Each zip contains `php_imagick.dll` plus all required ImageMagick runtime DLLs.

            | Asset | Type | Optimization | Use case |
            |---|---|---|---|
            ${{ steps.meta.outputs.asset_table }}

            ## Installation

            1. Extract the zip matching your PHP variant (TS or NTS) and CPU (AVX2 or standard)
            2. Copy `php_imagick.dll` to your PHP `ext/` directory (e.g. `C:\xampp\php\ext\`)
            3. Copy all `CORE_RL_*.dll` and other ImageMagick DLLs to PHP root (e.g. `C:\xampp\php\`)
            4. Add to `php.ini`:
               ```ini
               extension=php_imagick.dll
               ```
            5. Restart Apache / PHP-FPM
            6. Verify: `php -m | findstr imagick` should list "imagick"

            ## Requirements

            - ${{ steps.meta.outputs.requirement_line }}
            - For AVX2 builds: Intel Haswell (2013+) or AMD Ryzen (2017+) CPU
            - Windows x64 (10/11, Server 2016+)

            ## Source

            - Built with: https://github.com/php/php-sdk-binary-tools
            - PHP SDK: phpsdk-vs18-x64.bat (VS2024 / vs18)
            - ImageMagick: 7.1.1-47

            ---

            *Automated build via workflow `build-imagick.yaml`.*
          files: release_assets/*.zip
          generate_release_notes: false
          draft: false
          prerelease: true
